name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: finki-hub/.github/.github/workflows/dependabot.yaml@dedc1c63b89b27c45b60497be05ef77379d8d608 # main, 2026-10-26
