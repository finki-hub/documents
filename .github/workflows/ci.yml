name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate corpus and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run tests
        run: >-
          uv run --python 3.14
          --with pytest
          --with pymupdf
          --with pypdf
          --with python-docx
          --with langchain-text-splitters
          python -m pytest -q

      - name: Check code style
        run: uvx ruff check tools tests

      - name: Audit corpus
        run: uv run --python 3.14 python tools/preprocess.py audit
