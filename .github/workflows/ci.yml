name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate corpus and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true
          python-version: "3.14"

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Check code style
        run: uv run --locked ruff check tools tests

      - name: Check website generator types
        run: uv run --locked mypy --show-column-numbers --no-color-output

      - name: Audit corpus
        run: uv run --locked python tools/preprocess.py audit
