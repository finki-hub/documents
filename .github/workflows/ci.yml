name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate corpus and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          python-version: "3.14"

      - name: Run tests
        run: uv run --locked --no-build pytest -q

      - name: Check code style
        run: uv run --locked --no-build ruff check tools tests

      - name: Check website generator types
        run: uv run --locked --no-build mypy --show-column-numbers --no-color-output

      - name: Audit corpus
        run: uv run --locked --no-build python tools/preprocess.py audit
