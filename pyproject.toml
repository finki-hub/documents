[project]
name = "finki-hub-documents"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "anyio>=4.14.2,<5",
  "httpx2[brotli,http2,zstd]>=2.12.0,<3",
  "markdownify>=1.2.3,<2",
  "pydantic>=2.13.5,<3",
  "selectolax>=0.4.11,<1",
]

[dependency-groups]
dev = [
  "langchain-text-splitters>=1.1.2,<2",
  "mypy>=2.3.1,<3",
  "pymupdf>=1.28.2,<2",
  "pypdf>=6.16.2,<7",
  "pytest>=9.1.1,<10",
  "python-docx>=1.2.0,<2",
  "ruff>=0.16.5,<1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
explicit_package_bases = true
show_error_codes = true
warn_unused_configs = true
files = [
  "tools/website_content.py",
  "tools/website_fetch.py",
  "tools/website_http.py",
  "tools/website_markdown.py",
  "tools/website_markdown_safety.py",
  "tools/website_models.py",
  "tools/website_output.py",
  "tools/website_output_paths.py",
  "tools/website_privacy.py",
  "tools/website_reference.py",
  "tests/test_website_cli.py",
  "tests/test_website_content.py",
  "tests/test_website_fetch.py",
  "tests/test_website_http.py",
  "tests/test_website_markdown.py",
  "tests/test_website_models.py",
  "tests/test_website_output_safety.py",
  "tests/test_website_privacy.py",
  "tests/test_website_rest.py",
  "tests/test_website_review_regressions.py",
  "tests/test_website_reference.py",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "B905",    # Existing utility code predates strict zip length checks.
  "C901",    # Bounded state-machine branches are clearer kept together.
  "COM812",  # Conflicts with Ruff's formatter.
  "CPY001",  # This repository does not require per-file copyright headers.
  "D",       # Repository modules use names and types rather than API docstrings.
  "E501",    # Ruff's formatter intentionally leaves some long lines intact.
  "EM101",   # Typed project exceptions carry contextual literal reasons.
  "EM102",   # Typed project exceptions carry contextual formatted reasons.
  "FBT001",  # Existing command helpers expose narrow boolean flags.
  "FBT002",  # Existing command helpers expose narrow boolean defaults.
  "INP001",  # tools/ is intentionally an implicit namespace package.
  "PERF401", # Existing corpus utility favors an explicit accumulation loop.
  "PLC0415", # Platform-specific modules must be imported conditionally.
  "PLR0911", # Bounded parsers use early returns for rejected inputs.
  "PLR0912", # Crawl and CLI state machines retain explicit branches.
  "PLR0913", # Existing utility interface compatibility is preserved.
  "PLR0915", # Crawl state remains local to one bounded operation.
  "PLR0917", # Existing utility interface compatibility is preserved.
  "PLR2004", # Protocol and corpus constants are readable at their use sites.
  "PLW2901", # Existing corpus utility normalizes loop-local text in place.
  "PTH",     # os APIs are required for descriptor-relative and legacy I/O.
  "RET504",  # Existing corpus utility keeps the final normalized value named.
  "RUF001",  # Macedonian Cyrillic is intentional source content.
  "RUF003",  # Macedonian Cyrillic is intentional documentation text.
  "RUF043",  # Existing pytest regexes intentionally match broad error text.
  "S101",    # Assertions are the pytest contract.
  "S310",    # Existing URL callers validate trusted protocols separately.
  "S603",    # Existing subprocess arguments are fixed and shell-free.
  "T201",    # CLI commands intentionally write user-facing terminal output.
  "TC002",   # Runtime frameworks inspect selected third-party annotations.
  "TC003",   # Runtime annotations remain directly importable and readable.
  "TRY003",  # Typed project exceptions own contextual reason fields.
  "TRY300",  # Retry loops keep success exits adjacent to the operation.
  "TRY301",  # Transaction rollback must catch local typed failures.
]
